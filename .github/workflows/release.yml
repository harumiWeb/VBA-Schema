name: release

on:
  push:
    tags:
      - 'v*.*.*'

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-tag:
    name: Validate release tag
    runs-on: windows-latest
    outputs:
      tag: ${{ steps.validate.outputs.tag }}
    steps:
      - name: Validate stable semantic version tag
        id: validate
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if ($env:RELEASE_TAG -notmatch $pattern) {
            throw "Release tag must match vMAJOR.MINOR.PATCH without leading zeroes: $($env:RELEASE_TAG)"
          }
          "tag=$($env:RELEASE_TAG)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

  source-check:
    name: Source check before release
    needs: validate-tag
    uses: ./.github/workflows/source-check.yml
    permissions:
      contents: read

  release:
    name: Publish VBA-Release
    needs:
      - validate-tag
      - source-check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Confirm checkout is the pushed tag
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          $tagCommit = (& git rev-list -n 1 $env:RELEASE_TAG).Trim()
          if ($LASTEXITCODE -ne 0 -or $tagCommit -ne $env:RELEASE_SHA) {
            throw "Checked out tag does not resolve to the pushed commit. tag=$($env:RELEASE_TAG), tagCommit=$tagCommit, pushedCommit=$($env:RELEASE_SHA)"
          }

      - name: Package three-file VBA-Release payload
        shell: pwsh
        env:
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: ./tools/package-release.ps1 -Tag $env:RELEASE_TAG

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate-tag.outputs.tag }}
        run: |
          $assetPath = Join-Path $env:GITHUB_WORKSPACE "artifacts/release/VBA-Release-$($env:RELEASE_TAG).zip"
          if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
            throw "Release asset was not created: $assetPath"
          }

          $null = & gh release view $env:RELEASE_TAG --json tagName --jq .tagName 2>$null
          $viewExitCode = $LASTEXITCODE
          if ($viewExitCode -eq 0) {
            & gh release upload $env:RELEASE_TAG $assetPath --clobber
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            Write-Output "Updated existing GitHub Release: $($env:RELEASE_TAG)"
            exit 0
          }

          $createArguments = @(
            "release",
            "create",
            $env:RELEASE_TAG,
            $assetPath,
            "--verify-tag",
            "--generate-notes",
            "--title",
            "VBA-Schema $($env:RELEASE_TAG)"
          )
          & gh @createArguments
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
