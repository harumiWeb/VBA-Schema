# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: Show available development tasks
    cmds:
      - task --list

  provision-workbook:
    desc: Create build/Book.xlsm from an isolated xlflow scaffold
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/provision-workbook.ps1 -Destination build/Book.xlsm

  lint:
    desc: Run xlflow source lint
    cmds:
      - xlflow lint --json

  analyze:
    desc: Run xlflow runtime-risk analysis
    cmds:
      - xlflow analyze --json

  quality-audit:
    desc: Check compatibility-sensitive production patterns
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-production-hygiene.ps1

  fmt-check:
    desc: Check VBA formatting without modifying source
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/check-format.ps1

  samples-verify:
    desc: Check sample VBA formatting, lint, and runtime-risk analysis in isolation
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/verify-samples.ps1

  test-list:
    desc: Discover source-defined VBA tests without opening Excel
    cmds:
      - xlflow test list --json

  test:
    desc: Run VBA tests in the active xlflow session without saving
    cmds:
      - xlflow test --session --no-save --json

  verify-source:
    desc: Run Excel-free source checks
    deps:
      - lint
      - analyze
      - quality-audit
      - fmt-check
      - samples-verify
      - test-list
      - release-safety-test
      - benchmark-environment-test

  verify:
    desc: Run the currently available Excel-free verification checks
    deps:
      - verify-source

  release-stage:
    desc: Stage the three-file import payload under dist/VBA-Schema
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/release-stage.ps1

  release-verify:
    desc: Verify the staged three-file import payload
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/release-verify.ps1

  release-package:
    desc: Package the three-file VBA-Release asset (use TAG=v0.0.0)
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/package-release.ps1 -Tag "{{.TAG}}"

  release-safety-test:
    desc: Verify release staging rejects protected repository paths
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-release-stage-safety.ps1

  release-smoke:
    desc: Import the three-file payload into a fresh workbook and run scalar smoke checks
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/release-stage.ps1
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/release-verify.ps1
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/release-smoke.ps1

  benchmark:
    desc: Run runtime validation benchmarks in a dedicated managed Excel session
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/run-benchmark.ps1

  benchmark-environment-test:
    desc: Verify benchmark environment gating and report naming
    cmds:
      - powershell -NoProfile -ExecutionPolicy Bypass -File tools/test-benchmark-environment.ps1
